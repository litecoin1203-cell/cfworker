# Runs the Worker tests on every pull request, so a break shows up before anyone deploys (the deploy runs them
# again). Once per change: a push to a branch with a pull request no longer runs them a second time.
name: Test Cloud Gold server

on:
  pull_request:
    paths: ['worker/**', 'miniapp/**', '.github/workflows/test-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # the tests use node:sqlite
      - name: Run the tests with coverage (fails under 80% of lines)
        run: npm run coverage

  # the Telegram Mini App (miniapp/): unit tests and a build, which is what the deploy ships
  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build (fails on any compile error)
        run: npm run build && test -s ../worker/public/app/index.html && test -s ../worker/public/app/app.js
