# TEMPORARY diagnostic for the crypto payment bug, removed before merge. No secrets, no production access:
# only checks which public price / blockchain APIs answer a server outside Iran.
name: Diag crypto price sources
on:
  push:
    branches: [claude/project-thread-vvete5]
    paths: ['.github/workflows/diag-crypto.yml', '.github/diag/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node .github/diag/probe.mjs
