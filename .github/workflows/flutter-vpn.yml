# Pleat (Flutter client of the Cloud Gold Worker): analyze, test, run the
# client against the real Worker locally, and build an APK. The server
# address comes from the run input or the CG_API_BASE repository variable,
# the same one the Cloud Gold Android build uses.
name: Pleat Flutter app

on:
  push:
    paths: ['flutter_vpn/**', 'worker/**', '.github/workflows/flutter-vpn.yml']
  pull_request:
    paths: ['flutter_vpn/**', 'worker/**', '.github/workflows/flutter-vpn.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: "API address(es), comma-separated (empty = repository variable CG_API_BASE)"
        required: false

permissions:
  contents: read

env:
  # The same core and tun the Cloud Gold app ships (android.yml).
  HEV_COMMIT: 67dfba56c0a9254f401447e0751432bd36617d70
  XRAY_LIB_TAG: v26.7.5
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the manual run uses it, to put the APK on the pleat-latest release
    defaults:
      run:
        working-directory: flutter_vpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # The real Worker over Node's SQLite with a fake panel (worker/test/dev_server.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client against the local Worker
        run: |
          node --experimental-sqlite ../worker/test/dev_server.mjs > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          flutter test test/live_backend_test.dart --dart-define=LIVE_API=http://127.0.0.1:8787
      # Downloads from GitHub releases (Xray core, geo files) sometimes answer 504 for minutes. The last good
      # copies are kept in the Actions cache: a fresh download is always tried first (with long retries), and
      # only when GitHub keeps failing the cached copy is used, so a GitHub outage no longer fails the build.
      - name: Week of the cached downloads
        id: dl-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore cached downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pleat-dl
          key: pleat-dl-${{ env.XRAY_LIB_TAG }}-${{ steps.dl-week.outputs.week }}
          restore-keys: pleat-dl-
      - name: Check generated configs with the real Xray core
        run: |
          XRAY_DUMP=/tmp/xray-configs flutter test test/xray_config_test.dart
          dl=~/.cache/pleat-dl
          mkdir -p "$dl"
          # get NAME URL...: a fresh copy into the cache from the first URL that answers, or keep the cached
          # one when GitHub keeps failing
          get() {
            name=$1; shift
            for url in "$@"; do
              if curl -fsSL --retry 10 --retry-delay 20 --retry-all-errors --max-time 300 -o "$dl/$name.new" "$url"; then
                mv "$dl/$name.new" "$dl/$name"; return 0
              fi
            done
            if test -s "$dl/$name"; then
              echo "::warning::$name: GitHub did not answer, using the cached copy"
            else
              echo "::error::$name: download failed and there is no cached copy"; return 1
            fi
          }
          # XRAY_LIB_TAG is AndroidLibXrayLite's tag; Xray-core has no release by that name (404), so the
          # desktop core for this check is Xray-core's latest release
          if get xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"; then
            unzip -oq "$dl/xray.zip" -d /tmp/xray
          else
            # GitHub's release files answer 504 from some runners for a long time: the same core is also
            # published as a container image on ghcr.io, which is served from elsewhere
            echo "::warning::Xray zip unavailable, taking the core from its image ghcr.io/xtls/xray-core"
            mkdir -p /tmp/xray /tmp/xrayimg
            cid=$(docker create ghcr.io/xtls/xray-core:latest)
            docker export "$cid" | tar -x -C /tmp/xrayimg
            docker rm "$cid" > /dev/null
            cp "$(find /tmp/xrayimg -type f -name xray | head -1)" /tmp/xray/xray
          fi
          chmod +x /tmp/xray/xray && /tmp/xray/xray version | head -1
          # The app's own geo files, so the Iran-direct rules are checked too (they also go into the APK).
          geo=android/app/src/main/assets/geo
          mkdir -p "$geo"
          base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download"
          get geoip.dat "$base/geoip.dat"
          get geosite.dat "$base/geosite.dat"
          cp "$dl/geoip.dat" "$dl/geosite.dat" "$geo/"
          test -s "$geo/geoip.dat" && test -s "$geo/geosite.dat"
          export XRAY_LOCATION_ASSET="$PWD/$geo"
          for f in /tmp/xray-configs/*.json; do
            echo "== $(basename "$f")"
            /tmp/xray/xray run -test -c "$f"
          done
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
      - name: Restore libhev-socks5-tunnel
        id: hev-cache
        uses: actions/cache@v4
        with:
          path: flutter_vpn/android/app/libs
          key: pleat-hev-${{ env.HEV_COMMIT }}-${{ env.NDK_VERSION }}-${{ hashFiles('flutter_vpn/android/compile-hevtun.sh') }}
      - name: Build libhev-socks5-tunnel
        if: steps.hev-cache.outputs.cache-hit != 'true'
        working-directory: flutter_vpn/android
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          git -C hev-socks5-tunnel checkout "$HEV_COMMIT"
          git -C hev-socks5-tunnel submodule update --init --recursive
          bash compile-hevtun.sh
      - name: Download Xray core (libv2ray.aar)
        id: aar
        continue-on-error: true # a GitHub 504 falls back to the cached copy below
        uses: robinraju/release-downloader@v1.11
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: flutter_vpn/android/app/libs/
      - name: Keep or use the cached libv2ray.aar
        run: |
          dl=~/.cache/pleat-dl
          aar=android/app/libs/libv2ray.aar
          mkdir -p "$dl" android/app/libs
          if [ "${{ steps.aar.outcome }}" = success ] && test -s "$aar"; then
            cp "$aar" "$dl/libv2ray-${XRAY_LIB_TAG}.aar"
          elif test -s "$dl/libv2ray-${XRAY_LIB_TAG}.aar"; then
            echo "::warning::libv2ray.aar: GitHub did not answer, using the cached copy"
            cp "$dl/libv2ray-${XRAY_LIB_TAG}.aar" "$aar"
          else
            echo "::error::libv2ray.aar: download failed and there is no cached copy"; exit 1
          fi
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PLEAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::APP_KEYSTORE_BASE64 is not set. Signing with this runner's debug key: uninstall an older Pleat before installing this APK."
          fi
      - name: Build APK
        env:
          API_INPUT: ${{ github.event.inputs.api_base }}
          API_VAR: ${{ vars.CG_API_BASE }}
          PLEAT_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          PLEAT_KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS || 'cloudgold' }}
          PLEAT_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          # Optional: share links for the bridge a phone with no plan yet uses to reach the Worker when the open line
          # can't (space separated). Anyone can read them out of the APK, so give them their own small panel account.
          PLEAT_BRIDGE: ${{ secrets.PLEAT_BRIDGE }}
        run: |
          API="${API_INPUT:-$API_VAR}"
          [ -z "$API" ] && echo "::warning::No CG_API_BASE set; the APK will say it has no server address."
          # One APK per phone type: each carries only its own engine, about a third of the old all-in-one file.
          # Flutter adds 1000 x the type's number to the version code (arm64 2xxx), so they install over the old one.
          flutter build apk --release --split-per-abi --dart-define=PLEAT_API="$API" --dart-define=PLEAT_BRIDGE="$PLEAT_BRIDGE"
      - name: Check APKs
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk=build/app/outputs/flutter-apk/app-$abi-release.apk
            echo "== $abi: $(du -h "$apk" | cut -f1)"
            "$aapt" dump badging "$apk" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code)"
            libs=$(unzip -l "$apk" | grep -E "lib/$abi/lib(hev-socks5-tunnel|gojni|flutter)\.so" | awk '{print $4}')
            echo "$libs"
            [ "$(echo "$libs" | grep -c .)" = 3 ] || { echo "::error::$abi APK is missing an engine library"; exit 1; }
          done
      # The APKs of a manual run go to the release "pleat-latest" (Releases page of the repo). Release files do not
      # count toward the Actions artifact storage, which fills up and then refuses every upload. Pull requests and
      # pushes only prove the app builds and keep nothing.
      #   pleat-<version>-<build>-<abi>.apk  one per phone type; the Worker passes them to the app's in-app update
      #                                      (appupdate.js) once the admin announces the build in the bot. The last
      #                                      3 builds are kept, so the announced one survives the next build.
      #   pleat.apk                          the arm64 one (nearly every phone), to send by hand as before
      - name: Publish APKs to the pleat-latest release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          ver=${full%%+*}; build=${full##*+}
          notes="Pleat $full, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Install pleat.apk (or the file for your phone type)."
          if gh release view pleat-latest >/dev/null 2>&1; then
            gh release edit pleat-latest --title "Pleat $full (latest build)" --notes "$notes" --prerelease
          else
            gh release create pleat-latest --title "Pleat $full (latest build)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          out=build/app/outputs/flutter-apk
          files=()
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "$RUNNER_TEMP/pleat-$ver-$build-$abi.apk"
            files+=("$RUNNER_TEMP/pleat-$ver-$build-$abi.apk")
          done
          cp "$out/app-arm64-v8a-release.apk" "$RUNNER_TEMP/pleat.apk"
          gh release upload pleat-latest "${files[@]}" "$RUNNER_TEMP/pleat.apk" --clobber
          # keep the files of the newest 3 builds
          gh release view pleat-latest --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          keep=$(grep -oE '^pleat-[0-9.]+-[0-9]+-' "$RUNNER_TEMP/assets.txt" | grep -oE '[0-9]+-$' | tr -d '-' | sort -un | tail -3)
          while read -r name; do
            b=$(echo "$name" | sed -nE 's/^pleat-[0-9.]+-([0-9]+)-.*\.apk$/\1/p')
            if [ -n "$b" ] && ! echo "$keep" | grep -qx "$b"; then gh release delete-asset pleat-latest "$name" -y; fi
          done < "$RUNNER_TEMP/assets.txt"
          echo "### APKs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/pleat-latest" >> "$GITHUB_STEP_SUMMARY"
          ls -la "${files[@]}" | awk '{print "- " $9 ": " $5 " bytes"}' >> "$GITHUB_STEP_SUMMARY"
          echo "Announce it to the users in the bot: 📱 اپ Pleat › 📲 نسخه‌ی اپ" >> "$GITHUB_STEP_SUMMARY"
      # Also as a run artifact while storage allows; a full storage no longer fails the build.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: pleat-apk
          path: flutter_vpn/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 3
