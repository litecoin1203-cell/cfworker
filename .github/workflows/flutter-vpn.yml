# Pleat (Flutter client of the Cloud Gold Worker): analyze, test, run the
# client against the real Worker locally, and build an APK. The server
# address comes from the run input or the CG_API_BASE repository variable,
# the same one the Cloud Gold Android build uses.
name: Pleat Flutter app

# Actions minutes are limited (the repo is public, so every run's log is public too): a pull request runs only the checks (format, analyze, tests,
# the client against the local Worker, the configs through the real Xray core), once per change and never twice
# (no separate push run). The APK (NDK, core, Gradle: most of the minutes) is built only by the manual run.
on:
  pull_request:
    paths: ['flutter_vpn/**', '.github/workflows/flutter-vpn.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: "API address(es), comma-separated (empty = repository variable CG_API_BASE)"
        required: false

permissions:
  contents: read

# a newer push to the same pull request stops the run that is still going
concurrency:
  group: pleat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Xray core (AndroidLibXrayLite) and hev-socks5-tunnel builds the APK bundles.
  HEV_COMMIT: 67dfba56c0a9254f401447e0751432bd36617d70
  XRAY_LIB_TAG: v26.7.5
  NDK_VERSION: 29.0.14206865
  # Everything this job downloads into the APK, or runs to check it, is a fixed release with its SHA-256 kept here
  # (SEC-04): this job holds the signing key, and the geo files decide which sites skip the tunnel. A newer one is
  # taken on purpose, in a pull request that changes the tag and the sum together:
  #   libv2ray.aar  sha256sum of the release file of XRAY_LIB_TAG (2dust/AndroidLibXrayLite)
  #   Xray zip      the SHA2-256 line of Xray-linux-64.zip.dgst on the XRAY_CORE_TAG release (XTLS/Xray-core);
  #                 XRAY_CORE_IMAGE is the same version's image (docker pulls it by digest and checks it)
  #   geo files     <file>.sha256sum on the GEO_TAG release (Loyalsoldier/v2ray-rules-dat)
  XRAY_LIB_SHA256: 24d40bfd529430c273e52cdeb9dec1c6f5c7e76db632a908052248ce2c2ec325
  XRAY_CORE_TAG: v26.11.9
  XRAY_ZIP_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
  XRAY_CORE_IMAGE: ghcr.io/xtls/xray-core:26.11.9@sha256:9812e382e229e9ed63fd179bf1a4e3fe244c12ff3ae4fd8128745d79c87575ab
  GEO_TAG: '202611142203'
  GEOIP_SHA256: 304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8
  GEOSITE_SHA256: 0eb5e3cc3ced44a4dd36eb198b4ad4252a4017971979d7faa16d5c5e184c7462
  # The geo lists the APK keeps: exactly the `geoip:` / `geosite:` lists lib/ puts in a rule (geo_trim_test.dart
  # fails when the two differ). A new list in a rule goes here in the same pull request.
  GEOIP_KEEP: ir
  GEOSITE_KEEP: category-ir category-ads-all category-porn

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the manual run uses it, to put the APK on the pleat-latest release
    defaults:
      run:
        working-directory: flutter_vpn
    steps:
      # The manual run signs the APK and publishes it to pleat-latest, which the bot then offers to every user:
      # only main may do that, so a run started on any other branch stops before anything else (OPS-02).
      # Pull requests are not affected.
      - name: APK only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::The APK is built only from main, not from ${GITHUB_REF}. Merge the pull request, then run this workflow with 'Use workflow from: main'."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # The real Worker over Node's SQLite with a fake panel (worker/test/dev_server.mjs).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Client against the local Worker
        run: |
          node --experimental-sqlite ../worker/test/dev_server.mjs > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          flutter test test/live_backend_test.dart --dart-define=LIVE_API=http://127.0.0.1:8787
      # Downloads from GitHub releases (Xray core, geo files) sometimes answer 504 for minutes. The last good
      # copies are kept in the Actions cache: a fresh download is always tried first (with long retries), and
      # only when GitHub keeps failing the cached copy is used, so a GitHub outage no longer fails the build.
      - name: Week of the cached downloads
        id: dl-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore cached downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pleat-dl
          key: pleat-dl-${{ env.XRAY_LIB_TAG }}-${{ steps.dl-week.outputs.week }}
          restore-keys: pleat-dl-
      - name: Check generated configs with the real Xray core
        run: |
          XRAY_DUMP=/tmp/xray-configs flutter test test/xray_config_test.dart
          dl=~/.cache/pleat-dl
          mkdir -p "$dl"
          # sumok FILE SHA256: the file is exactly the pinned one
          sumok() { test -s "$1" && echo "$2  $1" | sha256sum -c --status; }
          # get NAME SHA256 URL...: a fresh copy into the cache from the first URL that answers with the pinned
          # file, or keep the cached one (checked again) when GitHub keeps failing. A file with another SHA-256 is
          # never used: a moved tag or a changed mirror stops the build instead of reaching the APK.
          get() {
            name=$1; sum=$2; shift 2
            for url in "$@"; do
              if curl -fsSL --retry 10 --retry-delay 20 --retry-all-errors --max-time 300 -o "$dl/$name.new" "$url"; then
                if sumok "$dl/$name.new" "$sum"; then mv "$dl/$name.new" "$dl/$name"; return 0; fi
                echo "::error::$name from $url is not the pinned file (SHA-256 $(sha256sum "$dl/$name.new" | cut -d' ' -f1), expected $sum)"
                rm -f "$dl/$name.new"; return 1
              fi
            done
            if sumok "$dl/$name" "$sum"; then
              echo "::warning::$name: GitHub did not answer, using the cached copy (SHA-256 checked)"
            else
              echo "::error::$name: download failed and there is no cached copy with the pinned SHA-256"; return 1
            fi
          }
          # XRAY_LIB_TAG is AndroidLibXrayLite's tag; Xray-core has no release by that name (404), so the
          # desktop core for this check is the Xray-core release XRAY_CORE_TAG
          mkdir -p /tmp/xray
          if get "xray-$XRAY_CORE_TAG.zip" "$XRAY_ZIP_SHA256" "https://github.com/XTLS/Xray-core/releases/download/$XRAY_CORE_TAG/Xray-linux-64.zip"; then
            unzip -oq "$dl/xray-$XRAY_CORE_TAG.zip" -d /tmp/xray
          else
            # GitHub's release files answer 504 from some runners for a long time: the same core is also
            # published as a container image on ghcr.io, which is served from elsewhere (pulled by its digest)
            echo "::warning::Xray zip unavailable, taking the core from its image $XRAY_CORE_IMAGE"
            mkdir -p /tmp/xrayimg
            cid=$(docker create "$XRAY_CORE_IMAGE")
            docker export "$cid" | tar -x -C /tmp/xrayimg
            docker rm "$cid" > /dev/null
            cp "$(find /tmp/xrayimg -type f -name xray | head -1)" /tmp/xray/xray
          fi
          chmod +x /tmp/xray/xray && /tmp/xray/xray version | head -1
          # The app's own geo files, so the Iran-direct rules are checked too (they also go into the APK).
          geo=android/app/src/main/assets/geo
          mkdir -p "$geo"
          base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$GEO_TAG"
          get "geoip-$GEO_TAG.dat" "$GEOIP_SHA256" "$base/geoip.dat"
          get "geosite-$GEO_TAG.dat" "$GEOSITE_SHA256" "$base/geosite.dat"
          # Only the lists the app's rules use go into the APK (PERF-A-03; about 28 MB down to about 5 MB per APK):
          # each kept list is copied byte for byte, so it matches exactly what it did in the full file
          dart run tool/geo_trim.dart "$dl/geoip-$GEO_TAG.dat" "$geo/geoip.dat" $GEOIP_KEEP
          dart run tool/geo_trim.dart "$dl/geosite-$GEO_TAG.dat" "$geo/geosite.dat" $GEOSITE_KEEP
          test -s "$geo/geoip.dat" && test -s "$geo/geosite.dat"
          export XRAY_LOCATION_ASSET="$PWD/$geo"
          for f in /tmp/xray-configs/*.json; do
            echo "== $(basename "$f")"
            /tmp/xray/xray run -test -c "$f"
          done
      - name: Install NDK
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
      - name: Restore libhev-socks5-tunnel
        if: github.event_name == 'workflow_dispatch'
        id: hev-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter_vpn/android/app/libs
          key: pleat-hev-${{ env.HEV_COMMIT }}-${{ env.NDK_VERSION }}-${{ hashFiles('flutter_vpn/android/compile-hevtun.sh') }}
      - name: Build libhev-socks5-tunnel
        if: github.event_name == 'workflow_dispatch' && steps.hev-cache.outputs.cache-hit != 'true'
        working-directory: flutter_vpn/android
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          git -C hev-socks5-tunnel checkout "$HEV_COMMIT"
          git -C hev-socks5-tunnel submodule update --init --recursive
          bash compile-hevtun.sh
      - name: Download Xray core (libv2ray.aar)
        if: github.event_name == 'workflow_dispatch'
        id: aar
        continue-on-error: true # a GitHub 504 falls back to the cached copy below
        uses: robinraju/release-downloader@a96f54c1b5f5e09e47d9504526e96febd949d4c2 # v1.11
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: flutter_vpn/android/app/libs/
      - name: Keep or use the cached libv2ray.aar
        if: github.event_name == 'workflow_dispatch'
        run: |
          dl=~/.cache/pleat-dl
          aar=android/app/libs/libv2ray.aar
          mkdir -p "$dl" android/app/libs
          # only the pinned core goes into the APK (SEC-04): a download or cached copy with another SHA-256 stops here
          sumok() { test -s "$1" && echo "$XRAY_LIB_SHA256  $1" | sha256sum -c --status; }
          if [ "${{ steps.aar.outcome }}" = success ] && test -s "$aar"; then
            if ! sumok "$aar"; then
              echo "::error::libv2ray.aar of $XRAY_LIB_TAG is not the pinned file (SHA-256 $(sha256sum "$aar" | cut -d' ' -f1), expected $XRAY_LIB_SHA256)"
              rm -f "$aar"; exit 1
            fi
            cp "$aar" "$dl/libv2ray-${XRAY_LIB_TAG}.aar"
          elif sumok "$dl/libv2ray-${XRAY_LIB_TAG}.aar"; then
            echo "::warning::libv2ray.aar: GitHub did not answer, using the cached copy (SHA-256 checked)"
            cp "$dl/libv2ray-${XRAY_LIB_TAG}.aar" "$aar"
          else
            rm -f "$aar"
            echo "::error::libv2ray.aar: download failed and there is no cached copy with the pinned SHA-256"; exit 1
          fi
      # The check above uses an Xray-core desktop release, but the app ships the core inside libv2ray.aar,
      # which is built from a commit of its own (no desktop release has that version). The same core is
      # built here from the version the library itself records, and every config is checked with it too,
      # so a field the app's core doesn't know fails here instead of on the phone.
      - name: Restore Go modules for the app's core
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: pleat-xray-app-${{ env.XRAY_LIB_TAG }}
      - name: Check generated configs with the app's own core version
        if: github.event_name == 'workflow_dispatch'
        run: |
          unzip -p android/app/libs/libv2ray.aar jni/x86_64/libgojni.so > /tmp/gojni.so
          info=$(go version -m /tmp/gojni.so)
          ver=$(printf '%s\n' "$info" | awk '$1 == "dep" && $2 == "github.com/xtls/xray-core" {print $3; exit}')
          rep=$(printf '%s\n' "$info" | awk 'f && $1 == "=>" {print $2 "@" $3; exit} {f = ($1 == "dep" && $2 == "github.com/xtls/xray-core")}')
          if [ -z "$ver" ]; then echo "::error::libv2ray.aar names no xray-core version"; exit 1; fi
          echo "app core: xray-core $ver ${rep:+(replaced by $rep)}"
          mkdir -p /tmp/xray-app && cd /tmp/xray-app
          rm -f go.mod go.sum && go mod init xray-app > /dev/null 2>&1
          go mod edit -require="github.com/xtls/xray-core@$ver"
          if [ -n "$rep" ]; then go mod edit -replace="github.com/xtls/xray-core=$rep"; fi
          GOTOOLCHAIN=auto GOFLAGS=-mod=mod go build -o /tmp/xray-app/xray github.com/xtls/xray-core/main
          /tmp/xray-app/xray version | head -1
          export XRAY_LOCATION_ASSET="$GITHUB_WORKSPACE/flutter_vpn/android/app/src/main/assets/geo"
          for f in /tmp/xray-configs/*.json; do
            echo "== $(basename "$f")"
            /tmp/xray-app/xray run -test -c "$f"
          done
      # The licence page lists every Go module compiled into libgojni.so (assets/licenses/go-modules.txt,
      # written by tool/go_licenses.py). A new XRAY_LIB_TAG with other modules fails here until it is rewritten.
      - name: Licences match the core's Go modules
        if: github.event_name == 'workflow_dispatch'
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p android/app/libs/libv2ray.aar "jni/$abi/libgojni.so" > "/tmp/gojni-$abi.so"
            python3 -I tool/go_licenses.py check "/tmp/gojni-$abi.so"
          done
      - name: Signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PLEAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::APP_KEYSTORE_BASE64 is not set. Signing with this runner's debug key: uninstall an older Pleat before installing this APK."
          fi
      # Gradle itself is downloaded from GitHub releases too (services.gradle.org redirects there): keep it
      - name: Restore Gradle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/wrapper/dists
          key: pleat-gradle-${{ hashFiles('flutter_vpn/android/gradle/wrapper/gradle-wrapper.properties') }}
      # Maven Central now answers some big jars (the Kotlin compiler) with a redirect to GitHub releases, which
      # answer 504 at times, and Gradle does not fall through to the next repository on an error. Google's full
      # mirror of Maven Central serves the files itself: an init script puts it first in every build (the app,
      # its plugins and Flutter's own Gradle plugin); google() and the others stay behind it.
      - name: Maven Central through Google's mirror
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-mirror.gradle <<'GRADLE'
          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def putFirst = { handler ->
            if (handler.findByName('centralMirror') == null) {
              def repo = handler.maven { name = 'centralMirror'; url = mirrorUrl }
              handler.remove(repo)
              handler.addFirst(repo)
            }
          }
          settingsEvaluated { settings ->
            // only where the build lists its own repositories (an empty list means the defaults)
            if (!settings.pluginManagement.repositories.isEmpty()) putFirst(settings.pluginManagement.repositories)
            def drm = settings.dependencyResolutionManagement
            if (!drm.repositories.isEmpty()) putFirst(drm.repositories)
            // a build that takes its repositories from settings (Flutter's own Gradle plugin: FAIL_ON_PROJECT_REPOS)
            // refuses project ones; there the mirror goes into the settings list above
            def mode = drm.repositoriesMode.getOrNull()
            settings.gradle.ext.centralMirrorInProjects = (mode == null || mode.toString() == 'PREFER_PROJECT')
          }
          allprojects { p ->
            def ext = p.gradle.ext
            if (ext.has('centralMirrorInProjects') && !ext.centralMirrorInProjects) return
            p.buildscript { putFirst(repositories) }
            putFirst(p.repositories)
          }
          GRADLE
      # The Gradle wrapper tries its download once and stops on a 504; fetch the same file with retries
      # into the place the wrapper looks first (dists/<name>/<base36 md5 of the URL>/), so it only unzips it.
      - name: Fetch Gradle with retries
        if: github.event_name == 'workflow_dispatch'
        run: |
          url=$(grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')
          name=$(basename "$url" .zip)
          hash=$(python3 - "$url" <<'PY'
          import hashlib, sys
          n = int(hashlib.md5(sys.argv[1].encode()).hexdigest(), 16)
          digits, out = '0123456789abcdefghijklmnopqrstuvwxyz', ''
          while n:
              n, r = divmod(n, 36)
              out = digits[r] + out
          print(out or '0')
          PY
          )
          dir=~/.gradle/wrapper/dists/$name/$hash
          if ls "$dir"/*.ok > /dev/null 2>&1; then echo "Gradle $name already installed"; exit 0; fi
          mkdir -p "$dir"
          if ! unzip -tq "$dir/$name.zip" > /dev/null 2>&1; then
            curl -fsSL --retry 10 --retry-delay 20 --retry-all-errors -o "$dir/$name.zip.part" "$url"
            mv "$dir/$name.zip.part" "$dir/$name.zip"
            unzip -tq "$dir/$name.zip" > /dev/null
          fi
          # the same SHA-256 the wrapper checks (distributionSha256Sum, from gradle.org/release-checksums)
          sum=$(grep '^distributionSha256Sum=' android/gradle/wrapper/gradle-wrapper.properties | cut -d= -f2)
          if ! echo "$sum  $dir/$name.zip" | sha256sum -c --status; then
            echo "::error::$name.zip is not the pinned Gradle (distributionSha256Sum $sum)"; rm -f "$dir/$name.zip"; exit 1
          fi
          echo "Gradle $name ready in $dir"
      - name: Build APK
        if: github.event_name == 'workflow_dispatch'
        env:
          API_INPUT: ${{ github.event.inputs.api_base }}
          API_VAR: ${{ vars.CG_API_BASE }}
          PLEAT_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          PLEAT_KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS || 'cloudgold' }}
          PLEAT_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          # Optional: share links for the bridge a phone with no plan yet uses to reach the Worker when the open line
          # can't (space separated). Anyone can read them out of the APK, so give them their own small panel account.
          PLEAT_BRIDGE: ${{ secrets.PLEAT_BRIDGE }}
        run: |
          API="${API_INPUT:-$API_VAR}"
          [ -z "$API" ] && echo "::warning::No CG_API_BASE set; the APK will say it has no server address."
          # One APK per phone type: each carries only its own engine, about a third of the old all-in-one file.
          # Flutter adds 1000 x the type's number to the version code (arm64 2xxx), so they install over the old one.
          flutter build apk --release --split-per-abi --dart-define=PLEAT_API="$API" --dart-define=PLEAT_BRIDGE="$PLEAT_BRIDGE"
      # JVM unit tests of the Kotlin that needs no phone (crash notes, scrubbing, the update SHA-256), on the classes
      # the build just compiled: they need libv2ray.aar and Flutter's Gradle setup, so only this run has them.
      # A failure stops the run before anything is published (QA-01).
      - name: Kotlin unit tests
        if: github.event_name == 'workflow_dispatch'
        working-directory: flutter_vpn/android
        run: ./gradlew --no-daemon :app:testReleaseUnitTest
      - name: Check APKs
        if: github.event_name == 'workflow_dispatch'
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk=build/app/outputs/flutter-apk/app-$abi-release.apk
            echo "== $abi: $(du -h "$apk" | cut -f1)"
            # where the size comes from: the biggest entries (stored size, uncompressed size, name)
            unzip -v "$apk" | awk 'NF >= 8 && $1 ~ /^[0-9]+$/ {print $3, $1, $8}' | sort -rn | head -8 \
              | awk '{printf "   %8.1f MB stored  %8.1f MB  %s\n", $1/1048576, $2/1048576, $3}'
            "$aapt" dump badging "$apk" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code)"
            libs=$(unzip -l "$apk" | grep -E "lib/$abi/lib(hev-socks5-tunnel|gojni|flutter)\.so" | awk '{print $4}')
            echo "$libs"
            [ "$(echo "$libs" | grep -c .)" = 3 ] || { echo "::error::$abi APK is missing an engine library"; exit 1; }
            # the engines' licences and source offer (Profile > Open-source licences)
            unzip -l "$apk" | grep -q "assets/flutter_assets/assets/licenses/SOURCE.txt" \
              || { echo "::error::$abi APK has no third-party licence texts"; exit 1; }
          done
      # The APKs of a manual run go to the release "pleat-latest" (Releases page of the repo). Release files do not
      # count toward the Actions artifact storage, which fills up and then refuses every upload. Pull requests and
      # pushes only prove the app builds and keep nothing.
      #   pleat-<version>-<build>-<abi>.apk  one per phone type; the Worker passes them to the app's in-app update
      #                                      (appupdate.js) once the admin announces the build in the bot. The last
      #                                      3 builds are kept, so the announced one survives the next build.
      #   pleat.apk                          the arm64 one (nearly every phone), to send by hand as before
      - name: Publish APKs to the pleat-latest release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          ver=${full%%+*}; build=${full##*+}
          notes="Pleat $full, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Install pleat.apk (or the file for your phone type)."
          # What's new: this version's lines from the file the app bundles too. The Worker reads the "- KIND: text"
          # lines from these release notes and offers them in the bot, where the admin can change them before announcing.
          wn=$(jq -r --arg v "$ver" '.[] | select(.version == $v) | .notes[] | "- \(.kind | ascii_upcase): \(.text)"' assets/whats_new/whats_new.json)
          if [ -n "$wn" ]; then notes="$notes"$'\n\n'"What's new in $ver:"$'\n'"$wn"; fi
          if gh release view pleat-latest >/dev/null 2>&1; then
            gh release edit pleat-latest --title "Pleat $full (latest build)" --notes "$notes" --prerelease
          else
            gh release create pleat-latest --title "Pleat $full (latest build)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          out=build/app/outputs/flutter-apk
          files=()
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "$RUNNER_TEMP/pleat-$ver-$build-$abi.apk"
            files+=("$RUNNER_TEMP/pleat-$ver-$build-$abi.apk")
          done
          cp "$out/app-arm64-v8a-release.apk" "$RUNNER_TEMP/pleat.apk"
          gh release upload pleat-latest "${files[@]}" "$RUNNER_TEMP/pleat.apk" --clobber
          # keep the files of the newest 3 builds
          gh release view pleat-latest --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          keep=$(grep -oE '^pleat-[0-9.]+-[0-9]+-' "$RUNNER_TEMP/assets.txt" | grep -oE '[0-9]+-$' | tr -d '-' | sort -un | tail -3)
          while read -r name; do
            b=$(echo "$name" | sed -nE 's/^pleat-[0-9.]+-([0-9]+)-.*\.apk$/\1/p')
            if [ -n "$b" ] && ! echo "$keep" | grep -qx "$b"; then gh release delete-asset pleat-latest "$name" -y; fi
          done < "$RUNNER_TEMP/assets.txt"
          echo "### APKs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/pleat-latest" >> "$GITHUB_STEP_SUMMARY"
          ls -la "${files[@]}" | awk '{print "- " $9 ": " $5 " bytes"}' >> "$GITHUB_STEP_SUMMARY"
          echo "Announce it to the users in the bot: 📱 اپ Pleat › 📲 نسخه‌ی اپ" >> "$GITHUB_STEP_SUMMARY"
      # Also as a run artifact while storage allows; a full storage no longer fails the build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: pleat-apk
          path: flutter_vpn/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 3
