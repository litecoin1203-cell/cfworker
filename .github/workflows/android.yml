# Builds the Cloud Gold VPN APKs (v2rayNG 2.2.6 core + Cloud Gold UI).
# Run it from GitHub: Actions -> "Build Cloud Gold APK" -> Run workflow.
name: Build Cloud Gold APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API address, e.g. https://api.yourdomain.com (empty = repository variable CG_API_BASE)"
        required: false
        type: string
      version_name:
        description: "Version shown to users"
        required: false
        default: "1.0.0"
        type: string
      version_code:
        description: "Whole number, must grow with every release"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

env:
  # pinned to the exact versions used by v2rayNG 2.2.6
  HEV_COMMIT: 67dfba56c0a9254f401447e0751432bd36617d70
  XRAY_LIB_TAG: v26.7.5
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check API address
        id: cfg
        run: |
          API="${{ inputs.api_base }}"
          [ -z "$API" ] && API="${{ vars.CG_API_BASE }}"
          if [ -z "$API" ]; then
            echo "::error::Set the API address: run input 'api_base' or repository variable CG_API_BASE"; exit 1
          fi
          echo "api=${API%/}" >> "$GITHUB_OUTPUT"

      - name: Fetch hev-socks5-tunnel
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          cd hev-socks5-tunnel
          git checkout "$HEV_COMMIT"
          git submodule update --init --recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          sed -i "10i\\    ndkVersion = \"$NDK_VERSION\"" V2rayNG/app/build.gradle.kts

      - name: Restore libhevtun
        id: hev-cache
        uses: actions/cache@v4
        with:
          path: android/libs
          key: libhevtun-${{ env.HEV_COMMIT }}-${{ env.NDK_VERSION }}-${{ hashFiles('android/compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy native libraries
        run: cp -r libs V2rayNG/app/

      - name: Download Xray core (libv2ray.aar)
        uses: robinraju/release-downloader@v1.11
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: android/V2rayNG/app/libs/

      - name: Bundle the Cloud Gold UI
        run: |
          rm -rf V2rayNG/app/src/main/assets/cloudgold
          mkdir -p V2rayNG/app/src/main/assets/cloudgold
          cp -r ../app-web/. V2rayNG/app/src/main/assets/cloudgold/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "temp=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APP_KEYSTORE_BASE64 is not set. Using a throwaway key: this APK cannot update a previously installed one."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass temp-pass -keypass temp-pass \
              -alias cloudgold -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cloud Gold" > /dev/null 2>&1
            echo "temp=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          STORE_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD || 'temp-pass' }}
          KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS || 'cloudgold' }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD || 'temp-pass' }}
        run: |
          if [ "${{ steps.sign.outputs.temp }}" = "true" ]; then STORE_PASS=temp-pass; KEY_ALIAS=cloudgold; KEY_PASS=temp-pass; fi
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease \
            -PCG_API_BASE="${{ steps.cfg.outputs.api }}" \
            -PCG_VERSION_NAME="${{ inputs.version_name || '1.0.0' }}" \
            -PCG_VERSION_CODE="${{ inputs.version_code || '1' }}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CloudGold-${{ inputs.version_name || '1.0.0' }}
          path: android/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
