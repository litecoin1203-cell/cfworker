# Deploys the Cloud Gold store to Cloudflare Workers + D1. The Worker registers its own Telegram webhook
# (with secret_token) on its next cron run, so no secret passes through GitHub.
# Run from GitHub: Actions -> "Deploy Cloud Gold server" -> Run workflow.
name: Deploy Cloud Gold server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # the tests use node:sqlite

      - name: Run the tests (nothing is deployed if they fail)
        run: npm test

      - name: Check the Cloudflare login
        run: |
          miss=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -z "${!v}" ] && miss="$miss $v"
          done
          if [ -n "$miss" ]; then echo "::error::Missing GitHub secrets:$miss"; exit 1; fi

      # Every other secret lives only in Workers Secrets (Cloudflare dashboard -> Worker -> Settings ->
      # Variables and Secrets). GitHub never sees them; this only checks their names exist.
      - name: Check the Worker secrets (names only)
        run: |
          have=$($WRANGLER secret list --format json 2>/dev/null | jq -r '.[].name' || true)
          if [ -z "$have" ]; then
            echo "::warning::Could not list the Worker secrets (first deploy?). Add them in the Cloudflare dashboard."
            exit 0
          fi
          miss=""
          for n in SECRET_KEY PUBLIC_BASE_URL PASARGUARD_URL TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_WEBHOOK_SECRET; do
            printf '%s\n' "$have" | grep -qx "$n" || miss="$miss $n"
          done
          if [ -n "$miss" ]; then echo "::error::Add these Workers Secrets in the Cloudflare dashboard:$miss"; exit 1; fi
          echo "Worker secrets present."

      - name: Create / find the D1 database
        run: |
          DB_ID=$($WRANGLER d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="cloudgold") | .uuid' | head -1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating database 'cloudgold'..."
            $WRANGLER d1 create cloudgold || true
            DB_ID=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="cloudgold") | .uuid' | head -1)
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then echo "::error::Could not create or find the D1 database"; exit 1; fi
          echo "Database id: $DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY/$DB_ID/" wrangler.jsonc

      - name: Apply database migrations
        run: $WRANGLER d1 migrations apply cloudgold --remote

      - name: Deploy the Worker
        run: $WRANGLER deploy

      # Pleat's in-app update reads the private release pleat-latest with a read-only token (fine-grained, this repo
      # only, Contents: Read). It lives in the GitHub secret PLEAT_DL_TOKEN and is copied to the Worker here.
      - name: Give the Worker the update download token
        env:
          PLEAT_DL_TOKEN: ${{ secrets.PLEAT_DL_TOKEN }}
        run: |
          if [ -z "$PLEAT_DL_TOKEN" ]; then
            echo "::warning::GitHub secret PLEAT_DL_TOKEN is not set, so Pleat's in-app update stays off."
            exit 0
          fi
          printf '%s' "$PLEAT_DL_TOKEN" | $WRANGLER secret put PLEAT_DL_TOKEN
