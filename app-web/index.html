<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1620" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<script>/* theme before first paint, so a light phone never flashes dark (design-system-patterns: theming) */
(function(){var v="system";try{v=localStorage.getItem("cg_theme")||"system"}catch(e){}var l=v==="light"||(v==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.setAttribute("data-theme",l?"light":"dark")})();</script>
<title>Cloud Gold</title>
<link rel="preload" href="fonts/Outfit.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Michroma.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<div id="app"></div>
<script>if(!window.CGHost)document.write('<scr'+'ipt src="mock.js"></scr'+'ipt>');</script>
<script src="vendor/qrcode.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="vpn.js"></script>
<script src="home.js"></script>
<script src="servers.js"></script>
<script src="usage.js"></script>
<script src="plans.js"></script>
<script src="settings.js"></script>
<script src="screens.js"></script>
<script>
(function () {
  var CG = window.CG;
  // deep links forwarded by the app: cloudgold://payment?order=12, cloudgold://ref/CODE
  window.__cgDeepLink = function (url) {
    var m = /payment\?order=(\d+)/.exec(url);
    if (m && CG.S.me) { CG.go('order', { id: +m[1] }); return; }
    var r = /ref\/([A-Za-z0-9]{4,16})/.exec(url);
    if (r) { try { localStorage.setItem('cg_ref', r[1].toUpperCase()); } catch (e) {} }
  };
  CG.call('session', {}).then(function (x) { CG.applyFontScale(x && x.fontScale); }).catch(function () {});
  CG.applyTheme();
  CG.call('vpnState', {}).then(function (v) {
    CG.S.vpn.running = !!(v && v.running);
    if (CG.S.vpn.running) {
      var since = 0;
      try { since = +localStorage.getItem('cg_since') || 0; } catch (e) {}
      CG.S.vpn.since = since || Date.now();
    }
  }).catch(function () {});
  var start = (location.hash || '').slice(1);
  CG.reset(CG.screens[start] ? start : 'splash', start === 'auth' ? { mode: 'login' } : start === 'onboarding' ? { step: 0 } : {});
})();
</script>
</body>
</html>
